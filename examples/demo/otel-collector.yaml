# The OpenTelemetry Collector sits between the applications and Etio, as it
# would in production: applications only know the collector.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    timeout: 1s

exporters:
  otlp/etio:
    endpoint: etio:4317
    tls:
      insecure: true
    # Etio answers UNAVAILABLE when its queue is full: retry with backoff.
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 2000

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/etio]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/etio]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/etio]
