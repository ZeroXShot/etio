[package]
name = "etio-server"
description = "The Etio server: OTLP ingestion, streaming root-cause analysis and an HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

build = "build.rs"

[[bin]]
name = "etio"
path = "src/main.rs"

[dependencies]
etio-core.workspace = true
etio-analysis.workspace = true
etio-pipeline.workspace = true
etio-engine.workspace = true
etio-otlp.workspace = true
etio-sim.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
prost.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["http1", "http2", "json", "query", "tokio"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7", features = ["trace", "fs", "cors", "limit"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
clap = { version = "4.5", features = ["derive", "env"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
prometheus-client = "0.25"
crossbeam-channel = "0.5"
flate2 = "1.1"
anyhow = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
postcard = { version = "1.1", features = ["use-std"] }
crc32fast = "1.4"
lz4_flex = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.20"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
